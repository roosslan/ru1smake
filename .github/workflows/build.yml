name: Build and release

on:
  push:
    branches: [trunk]
    tags: ["v*"]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

env:
  SOLUTION_FILE: ru1smake.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild $env:SOLUTION_FILE /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=$env:BUILD_PLATFORM /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ru1smake-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_CONFIGURATION }}
          path: ${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/ru1smake.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild $env:SOLUTION_FILE /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=$env:BUILD_PLATFORM /m

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/ru1smake.exe
          generate_release_notes: true
